apiVersion: v1
kind: Namespace
metadata:
  name: apigee
  labels:
    # Apigee hybrid runs some pods that need elevated capabilities; relax the
    # pod-security admission on this namespace (OpenShift 4.12+ enforces PSA).
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: apigee-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
