apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apigee-namespaces
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: apigee-hybrid
  source:
    repoURL: https://github.com/smaddula862/kong.git
    targetRevision: claude/apigee-hybrid-openshift-argocd-m1kdih
    path: apigee-hybrid-gitops/base/namespaces
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false        # never auto-prune namespaces
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
