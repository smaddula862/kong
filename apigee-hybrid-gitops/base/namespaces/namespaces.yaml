## Apigee namespaces. Replaces `kubectl create namespace apigee`.
## The apigee-system namespace hosts the operator; apigee hosts the runtime.
---
apiVersion: v1
kind: Namespace
metadata:
  name: apigee
  labels:
    # Runtime pods use the custom apigee-scc, not the namespace-default PSA level.
    # Keep PodSecurity at baseline; SCC governs the actual admission on OpenShift.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: apigee-system
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
