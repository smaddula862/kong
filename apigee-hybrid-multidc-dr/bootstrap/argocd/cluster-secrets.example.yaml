# -----------------------------------------------------------------------------
# ArgoCD cluster registration secrets (TEMPLATE - do NOT commit real tokens).
#
# ArgoCD runs in the "hub" cluster (openshift-gitops) and deploys Apigee hybrid
# to the two "spoke" data-center clusters. Each spoke is registered here with a
# name that the ApplicationSet references ({{ .cluster }} == east|west).
#
# Recommended: create these with `argocd cluster add <context>` or via the
# OpenShift GitOps operator + Sealed Secrets / External Secrets, and keep the
# bearer tokens out of git. This file documents the required shape.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: dc-east-cluster
  namespace: openshift-gitops
  labels:
    argocd.argoproj.io/secret-type: cluster
    apigee.dc: east
    apigee.role: primary          # DR role: primary | standby
stringData:
  name: dc-east
  server: https://api.east.ocp.example.com:6443
  config: |
    {
      "bearerToken": "<EAST_SA_TOKEN>",
      "tlsClientConfig": {
        "insecure": false,
        "caData": "<EAST_API_CA_BASE64>"
      }
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: dc-west-cluster
  namespace: openshift-gitops
  labels:
    argocd.argoproj.io/secret-type: cluster
    apigee.dc: west
    apigee.role: standby          # DR role: primary | standby
stringData:
  name: dc-west
  server: https://api.west.ocp.example.com:6443
  config: |
    {
      "bearerToken": "<WEST_SA_TOKEN>",
      "tlsClientConfig": {
        "insecure": false,
        "caData": "<WEST_API_CA_BASE64>"
      }
    }
